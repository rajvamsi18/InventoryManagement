name = "smkg-stt-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated origins allowed to call this proxy from a browser.
ALLOWED_ORIGIN = "https://rajvamsi18.github.io,http://localhost:5173,http://127.0.0.1:5173"

[ai]
binding = "AI"

[[ratelimits]]
name = "READ_LIST_LIMITER"
namespace_id = "84192017"

	[ratelimits.simple]
	limit = 12
	period = 60

# Set the real secret (never commit it) with:
#   wrangler secret put SARVAM_API_KEY
